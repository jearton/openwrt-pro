services:
  technitium:
    image: technitium/dns-server:15.6.2@sha256:1d5330f216d7e3bbe2192a73d114de61ca7c45800238e570cb22a6e86b7a892f
    platform: linux/amd64
    container_name: technitium-lab
    network_mode: bridge
    restart: unless-stopped
    environment:
      DNS_SERVER_DOMAIN: ns.lab.test
      DNS_SERVER_ADMIN_PASSWORD_FILE: /run/secrets/technitium_admin_password
      DNS_SERVER_RECURSION: Deny
      DNS_SERVER_PREFER_IPV6: "false"
      DNS_SERVER_WEB_SERVICE_LOCAL_ADDRESSES: "0.0.0.0"
      DOTNET_SYSTEM_NET_DISABLEIPV6: "1"
    ports:
      - "127.0.0.1:1053:53/tcp"
      - "127.0.0.1:1053:53/udp"
      - "127.0.0.1:5380:5380/tcp"
    volumes:
      - type: bind
        source: ${TECHNITIUM_CONFIG_DIR:-./state}
        target: /etc/dns
        bind:
          create_host_path: false
    secrets:
      - technitium_admin_password

secrets:
  technitium_admin_password:
    file: ./secrets/admin-password
