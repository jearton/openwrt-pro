[directories]
    config = /etc/netdata
    cache = /var/cache/netdata
    lib = /var/lib/netdata
    lock = /var/lib/netdata/lock
    home = /var/cache/netdata
    log = /var/log/netdata

[db]
    db = ram

[cloud]
    enabled = no

[plugins]
    enable running new plugins = no
    proc = yes
    sysfs = yes

[logs]
    daemon = stderr
    collector = stderr
    health = stderr
    access = off
